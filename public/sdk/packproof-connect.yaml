openapi: 3.1.0
info:
  title: PackProof Connect API
  version: 0.3.0
  description: >
    Compatibility contract for POST /api/connect/orders. New partner integrations
    should implement Merchant API v1 in docs/openapi/packproof-api-v1.json,
    including POST /v1/connect/sessions and the packproof.evidence.finalized webhook.
    Callback fields report digital evidence and limitations; they are not
    physical-authenticity or legal verdicts.
servers:
  - url: https://YOUR_PACKPROOF_DOMAIN.example
paths:
  /api/connect/orders:
    post:
      operationId: createPackProofEvidenceSession
      summary: Create or replay an idempotent evidence-capture session
      deprecated: true
      description: Legacy v0.2 envelope. Prefer POST /v1/connect/sessions with a merchant API credential bound to the Connect integration.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequest'
      responses:
        '201':
          description: New verification session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVerificationResponse'
        '200':
          description: Idempotent replay of an existing session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreateVerificationResponse'
                  - type: object
                    properties:
                      idempotentReplay: { const: true }
        '400': { description: Invalid payload or callback URL }
        '401': { description: Invalid API key }
        '403': { description: Disabled integration or platform mismatch }
        '409': { description: Idempotency key reused with a different payload }
webhooks:
  packproofEvidenceFinalized:
    post:
      operationId: receivePackProofEvidenceFinalized
      summary: Receive a Connect evidence-finalized callback
      parameters:
        - name: X-PackProof-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10,}$' }
        - name: X-PackProof-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' }
        - name: X-PackProof-Delivery
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCallback'
      responses:
        '200': { description: Partner accepted the delivery. Any 2xx is success. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PackProof API key
  schemas:
    CreateVerificationRequest:
      type: object
      additionalProperties: false
      required: [platform, orderId, sellerId, itemTitle, callbackUrl, idempotencyKey]
      properties:
        platform: { type: string, minLength: 2, maxLength: 80 }
        orderId: { type: string, minLength: 1, maxLength: 200 }
        sellerId: { type: string, minLength: 1, maxLength: 200 }
        trackingNumber: { type: string, minLength: 3, maxLength: 120 }
        carrier: { type: string, minLength: 1, maxLength: 80 }
        itemTitle: { type: string, minLength: 1, maxLength: 300 }
        itemDescription: { type: string, maxLength: 3000, default: '' }
        declaredWeightGrams: { type: integer, minimum: 0, maximum: 2000000 }
        priceMinor: { type: integer, minimum: 0, maximum: 10000000000, default: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: USD }
        callbackUrl: { type: string, format: uri, maxLength: 1000 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    ShippingTrackerObservation:
      type: object
      additionalProperties: false
      description: >
        Open-source tracking-number identification and canonical observation hash.
        This is checksum and courier identification from published tracking-number
        data, not live carrier custody.
      required: [lookupStatus, courierCode, courierName, publicTrackingUrl, stillSha256, stillCaptureStatus, observationSha256, clientObservationSha256, hashMatched, interpretation]
      properties:
        lookupStatus:
          type: string
          enum: [DATASET_VALIDATED, UNRECOGNIZED, LOOKUP_INCOMPLETE]
        courierCode: { type: [string, 'null'] }
        courierName: { type: [string, 'null'] }
        publicTrackingUrl: { type: [string, 'null'], format: uri }
        stillSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        stillCaptureStatus:
          type: [string, 'null']
          enum: [CAPTURED, FAILED, UNAVAILABLE_WHILE_RECORDING, NOT_ATTEMPTED, null]
        observationSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        clientObservationSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        hashMatched: { type: [boolean, 'null'] }
        interpretation: { const: OPEN_SOURCE_TRACKING_NUMBER_VALIDATION_NOT_CARRIER_CUSTODY }
    CreateVerificationResponse:
      type: object
      required: [success, sessionId, verificationUrl, expiresAt]
      properties:
        success: { const: true }
        sessionId: { type: string }
        verificationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        idempotentReplay: { type: boolean }
    VerificationCallback:
      type: object
      additionalProperties: false
      required: [event, orderId, evidenceStatus, statusReasonCodes, fileSha256, manifestSha256, evidenceBundleSha256, manifestAuthentication, assurance, dossierUrl, dossierUrlExpiresAt, dossierSha256, timestamp]
      properties:
        event: { const: packproof.evidence.finalized }
        orderId: { type: string }
        trackingNumber: { type: [string, 'null'] }
        evidenceStatus:
          type: string
          enum: [DIGITAL_EVIDENCE_READY, DIGITAL_EVIDENCE_WITH_LIMITATIONS]
        statusReasonCodes:
          type: array
          items:
            type: string
            enum:
              - SERVER_FINALIZATION_NOT_RECORDED
              - STRONGEST_APP_DEVICE_CONTEXT_NOT_AVAILABLE
              - CLIENT_SERVER_HASH_MATCH_NOT_ESTABLISHED
              - CLIENT_SERVER_SIZE_MATCH_NOT_ESTABLISHED
              - DECLARED_MEDIA_TYPE_MATCH_NOT_ESTABLISHED
              - CARRIER_CONTEXT_REQUIREMENT_NOT_SATISFIED
              - PHYSICAL_CORRESPONDENCE_NOT_AVAILABLE
              - BUSINESS_LEGAL_REVIEW_REQUIRED
        fileSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sha256Hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          deprecated: true
          description: Compatibility alias for fileSha256.
        manifestSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        evidenceBundleSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        manifestAuthentication:
          type: object
          additionalProperties: false
          required: [type, macBase64url, verificationScope]
          properties:
            type: { enum: [SERVICE_MAC, LEGACY_SERVICE_MAC] }
            algorithm: { const: HMAC-SHA256 }
            keyId: { type: string }
            macBase64url: { type: [string, 'null'] }
            verificationScope: { const: PACKPROOF_SERVICE_ONLY }
        assurance:
          type: object
          description: Independent acquisition-quality, app/device-context, byte-integrity, physical-correspondence, carrier-context, and business/legal-relevance dimensions.
          additionalProperties: true
          nullable: true
        attestationStatus: { type: string }
        carrierTrackingMatchStatus: { type: string }
        shippingTracker:
          oneOf:
            - $ref: '#/components/schemas/ShippingTrackerObservation'
            - type: 'null'
        declaredWeightGrams: { type: [integer, 'null'] }
        dossierUrl: { type: string, format: uri }
        dossierUrlExpiresAt: { type: string, format: date-time }
        dossierSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        timestamp: { type: string, format: date-time }
